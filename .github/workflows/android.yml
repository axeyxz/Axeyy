name: Build AXEYY Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify managed-profile provisioning handoff
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="app/src/main/java/com/axeyy/app/MainActivity.java"
          grep -Fq 'private ComponentName admin;' "$MAIN_ACTIVITY"
          grep -Fq 'admin = new ComponentName(this, AxeyyAdminReceiver.class);' "$MAIN_ACTIVITY"
          grep -Fq 'DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME,' "$MAIN_ACTIVITY"
          grep -Fq '            admin' "$MAIN_ACTIVITY"
          grep -Fq 'setup.resolveActivity(getPackageManager()) == null' "$MAIN_ACTIVITY"
          grep -Fq 'startActivityForResult(setup, REQUEST_CREATE_WORK_PROFILE)' "$MAIN_ACTIVITY"
          grep -Fq 'requestCode != REQUEST_CREATE_WORK_PROFILE' "$MAIN_ACTIVITY"
          grep -Fq 'resultCode == RESULT_OK' "$MAIN_ACTIVITY"
          grep -Fq 'dpm.clearApplicationUserData(' "$MAIN_ACTIVITY"
          grep -Fq 'confirmResetWorkApp(packageName' "$MAIN_ACTIVITY"
          grep -Fq 'Akun Google pada Work Profile tidak dihapus' "$MAIN_ACTIVITY"
      - name: Verify Work Profile manifest contract
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          grep -Eq 'android:name="android.software.managed_users".*android:required="false"' "$MANIFEST"
          grep -Fq 'android:name=".AxeyyAdminReceiver"' "$MANIFEST"
          grep -Fq 'android:permission="android.permission.BIND_DEVICE_ADMIN"' "$MANIFEST"
          grep -Fq 'android.app.action.PROFILE_PROVISIONING_COMPLETE' "$MANIFEST"
      - name: Verify Managed Google Play guidance boundary
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="app/src/main/java/com/axeyy/app/MainActivity.java"
          grep -Fq 'PANDUAN DISTRIBUSI APLIKASI' "$MAIN_ACTIVITY"
          grep -Fq 'https://developers.google.com/android/management/apps' "$MAIN_ACTIVITY"
          grep -Fq 'Managed Google Play iframe in the EMM admin console' "$MAIN_ACTIVITY"
          grep -Fq "AXEY's Android app is not the EMM backend." "$MAIN_ACTIVITY"
          grep -Fq 'Do not place service-account keys, passwords, or enrollment tokens in the APK.' "$MAIN_ACTIVITY"
      - name: Verify Android compatibility and APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.axeyy.app' versionCode='8' versionName='1.3.4'" <<< "$BADGING"
          grep -q "sdkVersion:'28'" <<< "$BADGING"
          grep -q "targetSdkVersion:'35'" <<< "$BADGING"
      - uses: actions/upload-artifact@v7
        with:
          name: AXEYY-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
