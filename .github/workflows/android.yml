name: Build AXEYY Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify Android compatibility and APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.axeyy.app' versionCode='5' versionName='1.3.1'" <<< "$BADGING"
          grep -q "sdkVersion:'28'" <<< "$BADGING"
          grep -q "targetSdkVersion:'35'" <<< "$BADGING"
      - uses: actions/upload-artifact@v7
        with:
          name: AXEYY-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
