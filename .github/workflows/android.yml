name: Build AXEYY Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build SOCKS5 native engine
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel native/hev-socks5-tunnel
          cd native/hev-socks5-tunnel
          printf '\nAPP_ABI := arm64-v8a\nAPP_PLATFORM := android-29\nAPP_CFLAGS += -DPKGNAME=com/axeyy/app -DCLSNAME=ProxyVpnService\n' >> Application.mk
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp -f libs/arm64-v8a/libhev-socks5-tunnel.so ../../app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AXEYY-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
